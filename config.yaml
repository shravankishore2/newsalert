# News Monitor configuration (NSE). Secrets live in .env, not here.

tickers_file: tickers.csv          # Nifty 500 constituents with Dhan security IDs
db_path: data/alerts.db            # live alerts, live quotes
history_db_path: data/history.db   # Dhan 1-minute bars for replay
token_cache_path: data/dhan_token.json   # gitignored, mode 600

index:
  symbol: NIFTY50
  name: NIFTY 50
  security_id: "13"                # Dhan scrip master: NSE, INDEX, "Nifty 50"
  segment: IDX_I
  instrument: INDEX

market:
  timezone: Asia/Kolkata
  open: "09:15"
  close: "15:30"
  # NSE equity-segment (CM) trading holidays. Source: NSE holiday calendar
  # (nseindia.com, "Trading Holidays", CM segment), copied 2026-09-27. Update yearly;
  # a year missing here logs a warning and treats every weekday as a trading day.
  # Special sessions (e.g. Diwali Muhurat trading) are not modelled.
  holidays:
    2026:
      - 2026-01-15   # Municipal Corporation Election - Maharashtra
      - 2026-01-26   # Republic Day
      - 2026-02-15   # Mahashivratri (Sunday)
      - 2026-03-03   # Holi
      - 2026-03-21   # Id-Ul-Fitr (Saturday)
      - 2026-03-26   # Shri Ram Navami
      - 2026-03-31   # Shri Mahavir Jayanti
      - 2026-04-03   # Good Friday
      - 2026-04-14   # Dr. Baba Saheb Ambedkar Jayanti
      - 2026-05-01   # Maharashtra Day
      - 2026-05-28   # Bakri Id
      - 2026-06-26   # Muharram
      - 2026-08-15   # Independence Day (Saturday)
      - 2026-09-14   # Ganesh Chaturthi
      - 2026-10-02   # Mahatma Gandhi Jayanti
      - 2026-10-20   # Dussehra
      - 2026-11-08   # Diwali Laxmi Pujan (Sunday; Muhurat session not modelled)
      - 2026-11-10   # Diwali-Balipratipada
      - 2026-11-24   # Prakash Gurpurb Sri Guru Nanak Dev
      - 2026-12-25   # Christmas

dhan:
  base_url: https://api.dhan.co/v2
  auth_url: https://auth.dhan.co/app/generateAccessToken
  # Limits from dhanhq.co/docs/v2 (checked 2026-09-27):
  #   Quote APIs (LTP): 1 request/s, up to 1000 instruments per request
  #   Data APIs (historical): 5 requests/s, 100,000 requests/day
  quote_per_second: 1
  data_per_second: 4         # headroom under 5/s
  data_per_day: 90000        # headroom under 100,000/day
  timeout_s: 15
  cycle_s: 60                # one LTP batch per minute, matching the 1-minute replay bars
  token_refresh_lead_min: 30 # refresh before the open (08:45 IST)
  token_refresh_margin_h: 2  # also refresh when a token has less than this left

news:
  cache_ttl_s: 300           # each feed fetched at most once per 5 min, only when alerts fire
  feeds:
    # Terms reviewed 2026-09-27; see README "News sources". Personal, non-commercial use.
    - name: NSE announcements
      url: https://nsearchives.nseindia.com/content/RSS/Online_announcements.xml
    - name: BusinessLine markets
      url: https://www.thehindubusinessline.com/markets/feeder/default.rss
    - name: BusinessLine companies
      url: https://www.thehindubusinessline.com/companies/feeder/default.rss

dashboard:
  host: 127.0.0.1            # local only; the news licences don't allow public republishing
  port: 8000
  push_poll_s: 1.0           # how often the push channel checks SQLite for new alerts
  session_hours: 12          # login lifetime

demo:
  # Replay datasets for demo mode. "nse" needs `fetch-history` first; "us" uses the
  # US build's yfinance bars (moved to data/history_us.db).
  datasets:
    nse:
      label: NSE Nifty 500 (Dhan 1-minute bars)
      history_db: data/history.db
      tickers_file: tickers.csv
      sector_column: industry
      index_symbol: NIFTY50
      index_name: NIFTY 50
      currency: "₹"
      timezone: Asia/Kolkata
    us:
      label: US S&P 500 (Yahoo 1-minute bars, 2026-08-31 to 2026-09-25)
      history_db: data/history_us.db
      tickers_file: demo/us_tickers.csv
      sector_column: sector
      index_symbol: SPY
      index_name: SPY
      currency: "$"
      timezone: America/New_York
  db_path: data/demo.db       # rebuilt on every demo start
  speed: 60                   # replayed market minutes per real minute
  warm_days: 1                # replay this many days instantly first (fills history for search)

# Alert and replay settings are unchanged from the US run (not retuned for NSE).
alerts:
  move_window_min: 15        # move measured against the price this long ago
  move_threshold: 0.015      # |move| >= 1.5% triggers a candidate alert
  max_ref_staleness_min: 10  # reference price must be at most window+this old
  cooldown_min: 30           # one alert per ticker per cooldown
  warmup_returns: 30         # history needed before any alert (both modes)
  ma_filter:
    enabled: true
    fast_min: 5              # fast SMA window
    slow_min: 60             # slow SMA window
    confirm_frac: 0.5        # fast SMA (now vs at ref time) must move >= this * threshold
  corr_filter:
    enabled: true
    returns: 30              # number of recent returns used for corr/beta
    min_corr: 0.6            # only de-market tickers that track the index
    index_max_staleness_min: 3

replay:
  false_alert_window_min: 30
  reversal_frac: 0.5         # false if it gives back more than this share of the move
  history_days: 90           # one Dhan intraday request per instrument (90-day cap)
